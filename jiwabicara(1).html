<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Jiwabicara · Ruang Curah Hati</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:linear-gradient(145deg,#0b1a2e,#0a111f);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:system-ui;padding:20px;}
        .chat-container{max-width:700px;width:100%;background:rgba(15,25,45,0.65);backdrop-filter:blur(18px);border-radius:48px;box-shadow:0 25px 45px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);}
        .chat-header{padding:20px 24px;background:rgba(10,20,35,0.7);border-bottom:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
        .brand h1{font-size:1.5rem;background:linear-gradient(135deg,#d9e2ff,#9bb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
        .brand p{font-size:0.75rem;color:#9ab3d5;}
        .controls{display:flex;gap:14px;background:rgba(0,0,0,0.4);padding:6px 12px;border-radius:60px;}
        .ctrl-btn{background:none;border:none;font-size:1.4rem;cursor:pointer;color:#cbdffc;width:40px;}
        .messages-area{height:460px;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth;}
        .message{max-width:85%;padding:12px 18px;border-radius:28px;animation:fadeSlide 0.25s;}
        .user-msg{align-self:flex-end;background:linear-gradient(105deg,#1d4a6e,#123454);color:#f0f4ff;border-bottom-right-radius:6px;}
        .system-msg{align-self:flex-start;background:rgba(30,40,58,0.9);backdrop-filter:blur(4px);color:#d6e6ff;border-left:3px solid #6c9eff;}
        .input-area{padding:20px;background:rgba(0,0,0,0.3);border-top:1px solid rgba(255,255,255,0.05);display:flex;gap:12px;}
        textarea{flex:1;background:#0e1a28;border:1px solid #2f4160;border-radius:32px;padding:14px 20px;color:#eef5ff;resize:none;font-family:inherit;outline:none;}
        textarea:focus{border-color:#7f9fff;box-shadow:0 0 8px rgba(100,150,255,0.4);}
        button.send-btn{background:#3f6bc0;border:none;border-radius:44px;width:54px;height:54px;font-size:1.6rem;cursor:pointer;color:white;transition:0.2s;}
        button.send-btn:hover{background:#2a55aa;transform:scale(0.96);}
        @keyframes fadeSlide{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .small-note{font-size:0.7rem;text-align:center;padding:8px;color:#6a7f9f;}
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div class="brand"><h1>🌊 Jiwabicara</h1><p>ruang aman untuk curahan hati</p></div>
        <div class="controls">
            <button id="langToggleBtn" class="ctrl-btn">🌐 ID</button>
            <button id="musicToggleBtn" class="ctrl-btn">🎵</button>
            <button id="voiceToggleBtn" class="ctrl-btn">🔊</button>
        </div>
    </div>
    <div class="messages-area" id="messagesArea">
        <div class="message system-msg">✨ Aku di sini. Curahkan apa yang mengendap...</div>
    </div>
    <div class="input-area">
        <textarea id="userInput" rows="1" placeholder="Tuliskan isi hatimu..."></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
    <div class="small-note">⏳ Setiap pesan akan kusampaikan ke pemilik hikmah. Jika beliau lama, aku akan menjawab dengan bijak.</div>
</div>

<!-- Form tersembunyi untuk mengirim notifikasi ke ntfy tanpa CORS -->
<iframe name="ntfyFrame" style="display:none"></iframe>
<form id="ntfyForm" method="POST" action="https://ntfy.sh/tanggapanjiwabicara" target="ntfyFrame" style="display:none">
    <input type="text" name="title" id="ntfyTitle">
    <textarea name="message" id="ntfyMessage"></textarea>
</form>

<script>
    // ========== KONFIGURASI ==========
    let currentLang = 'id';
    let voiceEnabled = true;
    let audioContext = null, musicSource = null, isMusicPlaying = false;
    const ADMIN_RESPONSE_TIMEOUT_MS = 60000;
    const STORAGE_KEY = 'jiwabicara_pending_requests';
    const NTFY_TOPIC = 'tanggapanjiwabicara'; // topik Anda
    
    // DOM
    const messagesDiv = document.getElementById('messagesArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const langToggleBtn = document.getElementById('langToggleBtn');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const voiceToggleBtn = document.getElementById('voiceToggleBtn');
    let activeTimeouts = new Map();

    // ========== FUNGSI STORAGE ==========
    function loadPending() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    function savePending(requests) { localStorage.setItem(STORAGE_KEY, JSON.stringify(requests)); window.dispatchEvent(new StorageEvent('storage', { key: STORAGE_KEY, newValue: JSON.stringify(requests) })); }

    // ========== ANALISIS SEDERHANA ==========
    function analyzeHeartfelt(text) {
        const lower = text.toLowerCase();
        let sentiment = 'netral', need = 'validasi & kehadiran';
        if (lower.includes('sedih')||lower.includes('kecewa')||lower.includes('sakit')) sentiment='negatif';
        if (lower.includes('senang')||lower.includes('bahagia')) sentiment='positif';
        if (lower.includes('cemas')||lower.includes('takut')) sentiment='negatif';
        if (lower.includes('perhatian')||lower.includes('dengar')) need='didengar & dipeluk';
        if (lower.includes('validasi')||lower.includes('benar')) need='validasi & kepastian';
        let recommendation = 'Aku meresapi.';
        if (sentiment==='negatif') recommendation='Aku merasakanmu.';
        if (sentiment==='positif') recommendation='Indah sekali.';
        if (need.includes('didengar')) recommendation='Kudengar sepenuh hati.';
        if (need.includes('validasi')) recommendation='Kau berhak merasa begitu.';
        return { sentiment, need, recommendation };
    }

    // ========== KIRIM NOTIF KE NTFY VIA FORM (TANPA CORS) ==========
    function sendNtfyViaForm(userText, sentiment) {
        const title = `📢 Laporan dari Jiwabicara`;
        const body = `💬 ${userText.substring(0, 140)}\nSentimen: ${sentiment.sentiment} | Kebutuhan: ${sentiment.need}`;
        document.getElementById('ntfyTitle').value = title;
        document.getElementById('ntfyMessage').value = body;
        document.getElementById('ntfyForm').submit();
        console.log('✅ Notifikasi ntfy dikirim via form (tidak terblokir CORS)');
        // Tidak ada umpan balik error, tapi jika gagal karena offline dll, tidak terdeteksi – kita abaikan.
    }

    // ========== TAMBAH REQUEST + TIMER ==========
    function addRequest(userText, sentimentData, recommendation) {
        const requests = loadPending();
        const id = Date.now()+'_'+Math.random().toString(36).substr(2,6);
        const newReq = { id, userText, timestamp: Date.now(), sentiment: sentimentData, systemRecommendation: recommendation, adminAnswer: null, autoAnswered: false };
        requests.push(newReq);
        savePending(requests);
        
        // Kirim ntfy via form (berhasil dari file://)
        sendNtfyViaForm(userText, sentimentData);
        
        // Timer timeout
        const timeout = setTimeout(() => {
            const updated = loadPending();
            const idx = updated.findIndex(r=>r.id===id);
            if (idx!==-1 && !updated[idx].adminAnswer && !updated[idx].autoAnswered) {
                updated[idx].adminAnswer = recommendation;
                updated[idx].autoAnswered = true;
                savePending(updated);
                addSystemMessage(recommendation, false);
                if (voiceEnabled) speakText(recommendation, currentLang);
            }
            activeTimeouts.delete(id);
        }, ADMIN_RESPONSE_TIMEOUT_MS);
        activeTimeouts.set(id, timeout);
        addSystemMessage(`⏳ "${userText.substring(0,50)}..." — menunggu jawaban penuh hikmah.`, true);
        return id;
    }

    function addSystemMessage(text, isPending=false) {
        const div = document.createElement('div');
        div.className = 'message system-msg';
        if(isPending) div.style.opacity='0.8';
        div.innerText = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'message user-msg';
        div.innerText = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function processUserMessage(raw) {
        if(!raw.trim()) return;
        addUserMessage(raw);
        userInput.value = '';
        const analysis = analyzeHeartfelt(raw);
        addRequest(raw, { sentiment: analysis.sentiment, need: analysis.need }, analysis.recommendation);
    }

    // ========== TTS ==========
    function speakText(text, lang) {
        if(voiceEnabled && window.speechSynthesis) {
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang==='id'?'id-ID':'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    }

    // ========== MUSIK AMBIENT ==========
    async function initMusic() { if(!audioContext) { audioContext = new (window.AudioContext||window.webkitAudioContext)(); let gain = audioContext.createGain(); gain.gain.value=0.15; gain.connect(audioContext.destination); window.musicGain=gain; } }
    async function startAmbientMusic() { if(!audioContext) await initMusic(); if(audioContext.state==='suspended') await audioContext.resume(); if(musicSource) try{ musicSource.osc1.stop(); musicSource.osc2.stop(); }catch(e){} let osc1=audioContext.createOscillator(), osc2=audioContext.createOscillator(); osc1.type='sine'; osc1.frequency.value=174.61; osc2.type='triangle'; osc2.frequency.value=261.63; let gain=audioContext.createGain(); gain.gain.value=0.12; osc1.connect(gain); osc2.connect(gain); gain.connect(window.musicGain); osc1.start(); osc2.start(); musicSource={osc1,osc2}; isMusicPlaying=true; }
    function stopMusic() { if(musicSource) { try{ musicSource.osc1.stop(); musicSource.osc2.stop(); }catch(e){} musicSource=null; } isMusicPlaying=false; }
    async function toggleMusic() { if(!audioContext) await initMusic(); if(isMusicPlaying) stopMusic(); else await startAmbientMusic(); }

    // ========== BAHASA ==========
    function setLanguage(lang) { currentLang=lang; langToggleBtn.innerText=lang==='id'?'🌐 ID':'🌐 EN'; userInput.placeholder=lang==='id'?'Tuliskan isi hatimu...':'Write what\'s in your heart...'; document.querySelector('.brand h1').innerHTML=lang==='id'?'🌊 Jiwabicara':'🌊 SoulSpeak'; document.querySelector('.brand p').innerText=lang==='id'?'ruang aman untuk curahan hati':'safe space for heartfelt outpour'; addSystemMessage(lang==='id'?'✨ Bahasa diubah ke Indonesia':'✨ Language changed to English', true); }
    function toggleVoice() { voiceEnabled=!voiceEnabled; voiceToggleBtn.style.opacity=voiceEnabled?'1':'0.5'; addSystemMessage(voiceEnabled?'Suara aktif':'Suara dimatikan', true); }

    // ========== RESPON DARI ADMIN (storage event) ==========
    window.addEventListener('storage', (e) => {
        if(e.key===STORAGE_KEY) {
            const updated = loadPending();
            const old = e.oldValue?JSON.parse(e.oldValue):[];
            for(let newReq of updated) {
                let oldReq = old.find(r=>r.id===newReq.id);
                if(oldReq && !oldReq.adminAnswer && newReq.adminAnswer) {
                    if(activeTimeouts.has(newReq.id)) { clearTimeout(activeTimeouts.get(newReq.id)); activeTimeouts.delete(newReq.id); }
                    addSystemMessage(newReq.adminAnswer, false);
                    if(voiceEnabled) speakText(newReq.adminAnswer, currentLang);
                }
            }
        }
    });

    // ========== INIT EVENT ==========
    sendBtn.addEventListener('click', () => processUserMessage(userInput.value));
    userInput.addEventListener('keydown', (e) => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); processUserMessage(userInput.value); } });
    langToggleBtn.addEventListener('click', () => setLanguage(currentLang==='id'?'en':'id'));
    musicToggleBtn.addEventListener('click', toggleMusic);
    voiceToggleBtn.addEventListener('click', toggleVoice);
    setLanguage('id');
    voiceToggleBtn.style.opacity='1';
</script>
</body>
</html>
